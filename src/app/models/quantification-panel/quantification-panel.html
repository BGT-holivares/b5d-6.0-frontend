@if (datos) {
  <aside class="b5d-quantification-panel">
    <div class="b5d-quantification-panel__summary">
      Total elementos: <strong>{{ datos.quantity.toFixed(2) }}</strong>
    </div>

    <table class="b5d-quantification-panel__table" b5dResizableTable="qto-summary">
      <thead>
        <tr>
          <th>Categoría</th>
          <th>Tipos</th>
          <th class="b5d-quantification-panel__number">Cantidad</th>
        </tr>
      </thead>

      <tbody>
        @for (categoria of datos.children; track categoria.id) {
          <tr>
            <td>{{ categoria.name }}</td>
            <td>{{ categoria.children.length }}</td>
            <td class="b5d-quantification-panel__number">{{ categoria.quantity.toFixed(2) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </aside>
}
