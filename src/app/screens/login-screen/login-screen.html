<main class="b5d-login-screen">
  <form class="b5d-login-card" (ngSubmit)="iniciarSesion()">
    <h1>{{ t('loginScreen.title') }}</h1>

    <label>
      <span>{{ t('loginScreen.username') }}</span>
      <input
        type="text"
        name="username"
        required
        autocomplete="username"
        [(ngModel)]="username"
      />
    </label>

    <label>
      <span>{{ t('loginScreen.password') }}</span>
      <input
        type="password"
        name="password"
        required
        autocomplete="current-password"
        [(ngModel)]="password"
      />
    </label>

    @if (mensajeError()) {
      <p class="b5d-login-card__error">{{ mensajeError() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? t('loginScreen.submitting') : t('loginScreen.submit') }}
    </button>
  </form>
</main>
